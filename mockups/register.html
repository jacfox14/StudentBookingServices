<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Booking Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-left">
            <div class="logo">SBS</div>
            <div class="nav-links"></div>
        </div>
        <div class="nav-right">
            <div class="login-icon">👤</div>
        </div>
    </nav>

    <main>
        <div class="register-container">
            <div class="register-header">
                <h1>Create Your Account</h1>
                <p>Student Booking Services</p>
            </div>

            <form>
                <div class="form-group">
                    <label for="email">University Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="your.name@university.edu"
                        required
                    >
                    <span class="hint-text">Must be @university.edu</span>
                </div>

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        placeholder="John Doe"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="major">Major</label>
                    <select id="major" required>
                        <option value="">Select your major</option>
                        <option value="computer-science">Computer Science</option>
                        <option value="engineering">Engineering</option>
                        <option value="business">Business Administration</option>
                        <option value="arts">Arts & Sciences</option>
                        <option value="health">Health Sciences</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="(555) 123-4567"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter a strong password"
                        required
                    >
                    <div class="password-requirements">
                        <h4>Password Requirements:</h4>
                        <ul>
                            <li>Minimum 8 characters</li>
                            <li>At least 1 uppercase letter</li>
                            <li>At least 1 number</li>
                        </ul>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Re-enter your password"
                        required
                    >
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms" class="checkbox-label">
                        I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="register-btn">Register</button>

                <div class="login-link">
                    Already have an account? <a href="login.html">Log In</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>Student Booking Services © 2026</p>
    </footer>
</body>
</html>
