<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Booking Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <nav class="navbar">
        <div class="navbar-left">
            <div class="navbar-logo">SBS</div>
        </div>
        <div class="navbar-right">
            <a href="register.html" class="btn btn-secondary btn-sm">Register</a>
        </div>
    </nav>

    <main>
        <div class="login-container">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Student Booking Services</p>
            </div>

            <form>
                <div class="form-group">
                    <label for="email">University Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="your.name@university.edu"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-group">
                    <a href="#forgot">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Log In</button>

                <div class="form-group text-center">
                    Don't have an account? <a href="register.html">Register New Account</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>Student Booking Services © 2026</p>
    </footer>
</body>
</html>
